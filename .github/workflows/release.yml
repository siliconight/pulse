name: Portable release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.13'
          cache: false
      - run: npm test
      - run: go test ./...
  package:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.13'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -c "import json,os; assert os.environ['RELEASE_TAG']=='v'+json.load(open('package.json'))['version'], 'Tag must match package.json version'"
      - run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: pulse-portable-packages
          path: releases/*
      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" releases/pulse-mac.zip releases/pulse-windows.zip releases/SHA256SUMS.txt --draft --verify-tag --title "Pulse $RELEASE_TAG" --notes "Portable browser-based release. Download the ZIP for your OS, extract it, and open Start Pulse. Unsigned builds; see READ-ME.txt. Test loading, playback, recording, and export before publishing this draft."
